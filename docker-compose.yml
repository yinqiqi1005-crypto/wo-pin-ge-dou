services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wo_pin_ge_dou
      POSTGRES_USER: wo_pin_ge_dou
      POSTGRES_PASSWORD: wo_pin_ge_dou_dev
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wo_pin_ge_dou"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:

