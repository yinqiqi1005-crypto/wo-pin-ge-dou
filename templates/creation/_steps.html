<ol class="steps" aria-label="生成步骤">
  <li class="{% if step >= 1 %}active{% endif %}">1 上传</li>
  <li class="{% if step >= 2 %}active{% endif %}">2 分析</li>
  <li class="{% if step >= 3 %}active{% endif %}">3 设置</li>
  <li class="{% if step >= 4 %}active{% endif %}">4 生成</li>
  <li class="{% if step >= 5 %}active{% endif %}">5 预览</li>
  <li class="{% if step >= 6 %}active{% endif %}">6 保存</li>
</ol>
