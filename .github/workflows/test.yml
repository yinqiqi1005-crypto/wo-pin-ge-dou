name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9
        with:
          python-version: "3.12"
          prune-cache: true
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils fonts-noto-cjk
      - run: uv sync --dev
      - run: uv run playwright install --with-deps chromium
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
  infrastructure:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: wo_pin_ge_dou
          POSTGRES_USER: wo_pin_ge_dou
          POSTGRES_PASSWORD: ci-only-database-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wo_pin_ge_dou"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_ENGINE: postgresql
      DB_NAME: wo_pin_ge_dou
      DB_USER: wo_pin_ge_dou
      DB_PASSWORD: ci-only-database-password
      DB_HOST: 127.0.0.1
      REDIS_URL: redis://127.0.0.1:6379/0
      CELERY_TASK_ALWAYS_EAGER: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9
        with:
          python-version: "3.12"
          prune-cache: true
      - run: uv sync --dev
      - run: uv run python manage.py migrate --noinput
      - name: Start Celery worker
        run: uv run celery -A config worker -l warning --detach --pidfile=/tmp/wo-pin-ge-dou-celery.pid
      - name: Verify concurrent infrastructure round trips
        run: >-
          uv run python manage.py check_infrastructure
          --concurrent-tasks 10
          --report artifacts/infrastructure-before-restart.json
      - name: Verify queued task survives worker restart
        shell: bash
        run: |
          first_worker_pid="$(cat /tmp/wo-pin-ge-dou-celery.pid)"
          kill "$first_worker_pid"
          for attempt in {1..20}; do
            if ! kill -0 "$first_worker_pid" 2>/dev/null; then
              break
            fi
            sleep 0.25
          done
          if kill -0 "$first_worker_pid" 2>/dev/null; then
            echo "First Celery worker did not stop."
            exit 1
          fi
          rm -f /tmp/wo-pin-ge-dou-celery.pid
          uv run python manage.py check_worker_recovery \
            --queued-signal /tmp/wo-pin-ge-dou-worker-recovery.queued \
            --timeout 30 \
            --report artifacts/worker-recovery.json &
          recovery_check_pid=$!
          for attempt in {1..20}; do
            if test -f /tmp/wo-pin-ge-dou-worker-recovery.queued; then
              break
            fi
            if ! kill -0 "$recovery_check_pid" 2>/dev/null; then
              wait "$recovery_check_pid"
            fi
            sleep 0.25
          done
          if ! test -f /tmp/wo-pin-ge-dou-worker-recovery.queued; then
            echo "Recovery task was not queued before the replacement worker started."
            kill "$recovery_check_pid" 2>/dev/null || true
            exit 1
          fi
          uv run celery -A config worker -l warning \
            --detach --pidfile=/tmp/wo-pin-ge-dou-celery.pid
          wait "$recovery_check_pid"
      - name: Verify replacement worker concurrency
        run: >-
          uv run python manage.py check_infrastructure
          --concurrent-tasks 10
          --report artifacts/infrastructure-after-restart.json
      - name: Upload infrastructure acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: infrastructure-acceptance
          path: artifacts/*.json
          if-no-files-found: warn
