[project]
name = "wo-pin-ge-dou"
version = "0.1.0"
description = "AI bead pattern creator"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "celery>=5.5,<6",
  "django>=5.2,<5.3",
  "gunicorn>=23,<24",
  "numpy>=2,<3",
  "openai>=2,<3",
  "pillow>=11,<13",
  "psycopg[binary]>=3.2,<4",
  "pypdf>=5,<7",
  "redis>=6,<7",
  "reportlab>=4,<5",
  "scikit-image>=0.25,<0.27",
  "whitenoise>=6,<7",
]

[dependency-groups]
dev = [
  "coverage>=7,<8",
  "pytest>=8,<10",
  "pytest-django>=4.9,<5",
  "pytest-playwright>=0.7,<1",
  "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "DJ"]
ignore = ["DJ001"]

[tool.ruff.format]
quote-style = "double"
